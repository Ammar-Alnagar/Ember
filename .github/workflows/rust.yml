name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # pyo3 0.22 supports up to Python 3.13; allow forward-compat on newer hosts
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # protoc is required by tonic-build (backends/client, v2, v3 build.rs).
    # Use the official pre-built binary to get proto3 optional-field support.
    - name: Install protoc
      run: |
        PROTOC_VERSION=25.3
        PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
        curl -fOL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
        sudo unzip -o "${PROTOC_ZIP}" -d /usr/local bin/protoc
        sudo unzip -o "${PROTOC_ZIP}" -d /usr/local 'include/*'
        rm -f "${PROTOC_ZIP}"
        protoc --version

    # Build the workspace in CPU-stub mode (no CUDA).
    # backends/trtllm and backends/llamacpp are excluded from default-members.
    - name: Build (no GPU)
      run: cargo build --verbose

    - name: Test (no GPU)
      run: cargo test --verbose
